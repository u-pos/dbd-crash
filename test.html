<!doctype html> 
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Match-3 Mobile Swipe</title>
<style>
body {margin:0; font-family:sans-serif; background:#222; color:#fff; text-align:center;}
.wrap {max-width:600px; margin:auto;}
header {padding:1rem;}
#gameBoard {display:grid; grid-template-columns:repeat(8,1fr); grid-template-rows:repeat(8,1fr); gap:2px; margin:auto; width:90vmin; height:90vmin;}
.tile {width:100%; aspect-ratio:1/1; background-size:cover;}
.start-btn {padding:1rem 2rem; font-size:1.5rem; margin-top:1rem; border:none; border-radius:12px; background:#ff9800; color:#fff; cursor:pointer;}
#gameOverOverlay {position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.85); color:#fff; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:10;}
.rank-container {margin:1rem; text-align:left;}
.rank-container h2 {font-size:1.2rem; margin-bottom:0.5rem;}
.rank-container ul {list-style:none; padding:0;}
.rank-container li {margin:0.2rem 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Match-3 Swipe</h1>
    <div>Score: <span id="score">0</span> | Moves: <span id="moves">0</span></div>
  </header>
  <div id="gameBoard"></div>
  <button id="startBtn" class="start-btn">START</button>
  <div class="rank-container">
    <h2>ランキング</h2>
    <ul id="rankingList"></ul>
  </div>
</div>
<div id="gameOverOverlay"></div>
<audio id="sndStart" src="s.mp3" preload="auto"></audio>
<audio id="sndClear" src="cc.mp3" preload="auto"></audio>
<audio id="bgm" src="bgm2.mp3" preload="auto" loop></audio>
<script>
const BOARD_SIZE=8;
const TILE_TYPES=6;
let board=[];
let score=0;
let moves=0;
let isProcessing=false;

const gameBoard=document.getElementById('gameBoard');
const scoreEl=document.getElementById('score');
const movesEl=document.getElementById('moves');
const startBtn=document.getElementById('startBtn');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const sndStart=document.getElementById('sndStart');
const sndClear=document.getElementById('sndClear');
const bgm=document.getElementById('bgm');

const API_BASE_URL="https://script.google.com/macros/s/AKfycbxTEST/exec/"; // ←差し替えてください

function createBoard(){
  board=[];
  for(let r=0;r<BOARD_SIZE;r++){
    board[r]=[];
    for(let c=0;c<BOARD_SIZE;c++){
      board[r][c]=Math.floor(Math.random()*TILE_TYPES);
    }
  }
}
function drawBoard(){
  gameBoard.innerHTML='';
  for(let r=0;r<BOARD_SIZE;r++){
    for(let c=0;c<BOARD_SIZE;c++){
      const tile=document.createElement('div');
      tile.className='tile';
      tile.style.backgroundImage=`url(tile${board[r][c]+1}.png)`;
      tile.dataset.row=r; tile.dataset.col=c;
      gameBoard.appendChild(tile);
    }
  }
}
function startGame(){
  score=0;moves=20;
  updateUI();
  createBoard();
  drawBoard();
  startBtn.style.display='none';
  gameOverOverlay.style.display='none';
  sndStart.play(); bgm.currentTime=0; bgm.play();
}
function updateUI(){
  scoreEl.textContent=score;
  movesEl.textContent=moves;
}
function showGameOver(){
  bgm.pause();
  fetch(API_BASE_URL+'check_rank.php',{
    method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({score})
  })
  .then(res=>res.text())
  .then(text=>{
    let data={};
    try{ data=JSON.parse(text);}catch(e){ console.warn('JSON parse error',text); }
    if(data.success && data.entersTop20){
      gameOverOverlay.style.display='flex';
      gameOverOverlay.innerHTML=`
        <div>最終スコア</div>
        <div style="font-size:15vw; font-weight:900;">${score}</div>
        <input type="text" id="playerName" maxlength="50" placeholder="名前を入力" style="font-size:5vw;padding:5px;margin:1rem 0;">
        <button id="saveNameBtn" class="start-btn">登録</button>
      `;
      document.getElementById('saveNameBtn').onclick=()=>{
        const btn=document.getElementById('saveNameBtn');
        const name=document.getElementById('playerName').value.trim();
        if(!name){alert('名前を入力してください');return;}
        btn.disabled=true;btn.textContent='送信中...';
        fetch(API_BASE_URL+'save_score.php',{
          method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body:new URLSearchParams({name,score})
        })
        .then(r=>r.text())
        .then(text=>{
          let res={};
          try{res=JSON.parse(text);}catch(e){console.warn('JSON parse error',text);}
          if(res.success){
            alert('登録しました！');
            loadRanking();
            gameOverOverlay.innerHTML=`
              <div>最終スコア</div>
              <div style="font-size:15vw; font-weight:900;">${score}</div>
              <button id="restartBtn" class="start-btn">RESTART</button>
            `;
            document.getElementById('restartBtn').onclick=()=>{startGame();};
          }else{
            alert(res.error||'登録失敗'); btn.disabled=false; btn.textContent='登録';
          }
        })
        .catch(err=>{alert('通信エラー');console.error(err);btn.disabled=false;btn.textContent='登録';});
      };
    }else{
      gameOverOverlay.style.display='flex';
      gameOverOverlay.innerHTML=`
        <div>最終スコア</div>
        <div style="font-size:15vw; font-weight:900;">${score}</div>
        <button id="restartBtn" class="start-btn">RESTART</button>
      `;
      document.getElementById('restartBtn').onclick=()=>{startGame();};
    }
  })
  .catch(err=>{alert('通信エラー');console.error(err);});
}

function loadRanking(){
  fetch(API_BASE_URL+'get_ranking.php')
  .then(r=>r.text())
  .then(text=>{
    let data=[];
    try{data=JSON.parse(text);}catch(e){console.warn('JSON parse error',text);}
    const ul=document.getElementById('rankingList');
    ul.innerHTML='';
    data.forEach((row,i)=>{
      const li=document.createElement('li');
      li.textContent=`${i+1}. ${row.name} - ${row.score}`;
      ul.appendChild(li);
    });
  });
}

startBtn.addEventListener('click',startGame);
window.addEventListener('load',()=>{loadRanking();});
</script>
</body>
</html>
