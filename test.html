<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Match-3 Mobile Swipe</title>
<style>
:root { --cols:8; --rows:8; --tile-size:11vw; }
html,body{margin:0;padding:0;width:100%;height:100%;background:#111;color:#fff;font-family:sans-serif;overflow:hidden;}
.wrap{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5vw;font-size:3.6vw;font-weight:600;}
.panel{background:rgba(255,255,255,0.04);padding:0.8vw 1.5vw;border-radius:12px;min-width:28vw;text-align:center;}
#combo{color:#ffde59;font-weight:900;font-size:3.5vw;}
.board{background:linear-gradient(180deg,rgba(255,255,255,0.03),transparent);padding:6px;border-radius:10px;display:grid;grid-template-columns:repeat(var(--cols),var(--tile-size));gap:4px;touch-action:none;box-sizing:border-box;}
.cell{width:var(--tile-size);height:var(--tile-size);border-radius:8px;overflow:hidden;background:#111a2a;display:flex;align-items:center;justify-content:center;}
.cell img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
@keyframes vanish{0%{transform:scale(1);opacity:1;}50%{transform:scale(1.25);opacity:0.6;}100%{transform:scale(0);opacity:0;}}
.vanish{animation:vanish 180ms cubic-bezier(.2,.9,.3,1) forwards;}
.start-overlay,#gameOverOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.35);border-radius:10px;flex-direction:column;z-index:10;}
.start-btn{background:linear-gradient(90deg,#ff7ab6,#7b61ff);border:none;padding:14px 26px;border-radius:999px;font-size:1.8rem;color:#fff;cursor:pointer;}
#gameOverOverlay{font-size:10vw;font-weight:900;flex-wrap:wrap;gap:1vw;text-align:center;display:none;}
.bottom-buttons{display:flex;justify-content:center;align-items:center;gap:1.5rem;margin-top:0.8rem;}
.icon-btn{background:none;border:none;font-size:2.8rem;color:white;cursor:pointer;}
.rules-table-fixed{margin-top:0.5rem;font-size:0.75rem;width:100%;}
.rules-table-fixed table{width:100%;color:#fff;border-collapse:collapse;text-align:center;}
.rules-table-fixed th,.rules-table-fixed td{border-bottom:1px solid #555;padding:0.2rem;}
.rules-table-fixed th{border-bottom:2px solid #ffde59;}
.pause-overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:black;z-index:20;flex-direction:column;color:white;font-size:1.5rem;}
#rankingOverlay{position: fixed; inset:0;background: rgba(0,0,0,0.7); z-index:100; display:none; justify-content:center; align-items:center;}
.ranking-content{background: rgba(255,255,255,0.95); color: #000; padding: 1rem; border-radius: 8px; width:80%; max-width:500px; display:flex; flex-direction:column; max-height:80%; overflow-y:auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="panel">Score: <span id="score">0</span></div>
    <div class="panel">残り <span id="time">60</span> 秒</div>
    <div class="panel"><span id="combo"></span></div>
  </div>
  <div id="boardWrap" style="position:relative;">
    <div id="board" class="board"></div>
    <div id="overlay" class="start-overlay">
      <button id="startBtn" class="start-btn">START</button>
    </div>
    <div id="pauseOverlay" class="pause-overlay">
      <div id="pauseText">一時停止中</div>
      <button id="resumeBtn" class="start-btn">▶</button>
    </div>
    <div id="gameOverOverlay"></div>
  </div>
  <div class="bottom-buttons">
    <button id="muteBtn" class="icon-btn">🔇</button>
    <button id="pauseBtn" class="icon-btn">⏸</button>
    <button id="rankingBtn" class="icon-btn">🏆</button>
  </div>
  <div class="rules-table-fixed">
    <table>
      <thead><tr><th>得点ルール</th><th>内容</th></tr></thead>
      <tbody>
        <tr><td>3個消し</td><td>100点</td></tr>
        <tr><td>4個消し</td><td>300点</td></tr>
        <tr><td>5個消し</td><td>500点</td></tr>
        <tr><td colspan="2">2コンボ目は得点2倍、3コンボ目は得点3倍。</td></tr>
      </tbody>
    </table>
  </div>
</div>

<div id="rankingOverlay">
  <div class="ranking-content">
    <button id="closeRanking" class="icon-btn" style="font-size:2rem;align-self:flex-end;">✖</button>
    <h2 style="text-align:center;">🏆 ランキング TOP20 🏆</h2>
    <div id="rankingList" style="font-size:4vw;"></div>
  </div>
</div>

<audio id="sndStart" src="s.mp3" preload="auto"></audio>
<audio id="sndClear" src="cc.mp3" preload="auto"></audio>
<audio id="bgm" src="bgm2.mp3" preload="auto" loop></audio>

<script>
const API_BASE_URL='https://junkhin.com/api/';
const ROWS=8, COLS=8, TILE_TYPES=6, GAME_TIME=60;
let board=[],running=false,score=0,timeLeft=GAME_TIME,timerId,combo=1,processing=false;
const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const comboEl=document.getElementById('combo');
const overlay=document.getElementById('overlay');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const sndStart=document.getElementById('sndStart');
const sndClear=document.getElementById('sndClear');
const bgm=document.getElementById('bgm'); bgm.volume=0.2;

function idx(r,c){return r*COLS+c;}
function rc(i){return [Math.floor(i/COLS),i%COLS];}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}
function escapeHtml(str){return str.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function generateBoard(){
  const b=new Array(ROWS*COLS).fill(0);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let attempts=0;
      while(true){
        const t=randInt(1,TILE_TYPES);
        b[idx(r,c)]=t;
        let bad=false;
        if(c>=2 && b[idx(r,c-1)]==t && b[idx(r,c-2)]==t) bad=true;
        if(r>=2 && b[idx(r-1,c)]==t && b[idx(r-2,c)]==t) bad=true;
        if(!bad) break;
        attempts++; if(attempts>50) break;
      }
    }
  }
  return b;
}

function findMatches(b){
  const clear=new Set();
  for(let r=0;r<ROWS;r++){
    let runT=null, runS=0, runL=0;
    for(let c=0;c<COLS;c++){
      const t=b[idx(r,c)];
      if(t===runT) runL++; else { if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(r,runS+k)); runT=t; runS=c; runL=1; }
    }
    if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(r,runS+k));
  }
  for(let c=0;c<COLS;c++){
    let runT=null, runS=0, runL=0;
    for(let r=0;r<ROWS;r++){
      const t=b[idx(r,c)];
      if(t===runT) runL++; else { if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(runS+k,c)); runT=t; runS=r; runL=1; }
    }
    if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(runS+k,c));
  }
  return Array.from(clear).sort((a,b)=>a-b);
}

function collapseBoard(b){
  const nb=b.slice();
  for(let c=0;c<COLS;c++){
    let emptyRow=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(nb[idx(r,c)]!==0){
        nb[idx(emptyRow,c)]=nb[idx(r,c)];
        if(emptyRow!==r) nb[idx(r,c)]=0;
        emptyRow--;
      }
    }
    for(let r=emptyRow;r>=0;r--) nb[idx(r,c)]=randInt(1,TILE_TYPES);
  }
  return nb;
}

function swapTiles(b,i1,i2){const nb=b.slice();[nb[i1],nb[i2]]=[nb[i2],nb[i1]];return nb;}

function scoreForMatch(count){switch(count){case 3:return 100;case 4:return 300;case 5:return 500;default:return 500+(count-5)*100;}}

function renderBoard(prevBoard){
  boardEl.innerHTML='';
  for(let i=0;i<board.length;i++){
    const t=board[i];
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.i=i;
    if(t>0){
      const img=document.createElement('img');
      img.src=`tile${t}.png`;
      if(prevBoard && prevBoard[i]===0){ img.style.opacity='0'; img.style.transform='translateY(-120%)'; requestAnimationFrame(()=>{ img.style.transition='transform 0.4s ease, opacity 0.4s ease'; img.style.transform='translateY(0)'; img.style.opacity='1'; }); }
      cell.appendChild(img);
    }
    boardEl.appendChild(cell);
  }
}

function updateUI(){ scoreEl.textContent=score; timeEl.textContent=timeLeft; comboEl.textContent=combo>1?`${combo}コンボ！`:''; }

function startGame(){
  overlay.style.display='none';
  gameOverOverlay.style.display='none';
  board=generateBoard(); score=0; timeLeft=GAME_TIME; combo=1; processing=false; running=true;
  updateUI(); renderBoard();
  sndStart.currentTime=0; sndStart.play();
  bgm.currentTime=0; bgm.play().catch(()=>{});
  timerId=setInterval(()=>{ timeLeft--; updateUI(); if(timeLeft<=0){ endGame(); } },1000);
}

function endGame(){
  running=false; clearInterval(timerId); bgm.pause();
  askNameAndSubmitScore();
}

function askNameAndSubmitScore(){
  gameOverOverlay.style.display='flex';
  gameOverOverlay.innerHTML=`
    <div>最終スコア</div>
    <div style="font-size:8vw;font-weight:900;">${score}</div>
    <input id="playerName" placeholder="名前入力" style="font-size:4vw;margin:1vw 0;padding:0.5vw;border-radius:8px;border:none;text-align:center;"/>
    <button id="submitScoreBtn" class="start-btn">登録</button>
  `;
  document.getElementById('submitScoreBtn').onclick=async()=>{
    const name=document.getElementById('playerName').value.trim(); if(!name)return alert('名前を入力してください');
    try{
      await fetch(`${API_BASE_URL}set_score`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,score})});
      document.getElementById('submitScoreBtn').textContent='再挑戦';
      document.getElementById('submitScoreBtn').onclick=startGame;
    }catch(e){alert('通信エラー');}
  };
}

boardEl.addEventListener('touchstart',handleTouchStart,false);
boardEl.addEventListener('touchmove',handleTouchMove,false);
boardEl.addEventListener('touchend',handleTouchEnd,false);

let touchStart=null;
function handleTouchStart(e){ if(!running || processing) return; const t=e.touches[0]; touchStart={x:t.clientX,y:t.clientY,el:e.target.closest('.cell')}; }
function handleTouchMove(e){ if(!touchStart) return; e.preventDefault(); }
function handleTouchEnd(e){ if(!touchStart) return; const t=e.changedTouches[0]; const dx=t.clientX-touchStart.x, dy=t.clientY-touchStart.y; if(Math.abs(dx)<var(--tile-size)/2 && Math.abs(dy)<var(--tile-size)/2){ touchStart=null; return; } let swapI=null; const i=parseInt(touchStart.el.dataset.i); if(Math.abs(dx)>Math.abs(dy)){ if(dx>0 && (i%COLS)<COLS-1) swapI=i+1; else if(dx<0 && (i%COLS)>0) swapI=i-1; } else{ if(dy>0 && Math.floor(i/COLS)<ROWS-1) swapI=i+COLS; else if(dy<0 && Math.floor(i/COLS)>0) swapI=i-COLS; } if(swapI!==null){ processing=true; board=swapTiles(board,i,swapI); renderBoard(); setTimeout(processMatches,200); } touchStart=null; }

function processMatches(){
  const matches=findMatches(board);
  if(matches.length===0){ combo=1; processing=false; return; }
  combo++; let points=0; matches.forEach(i=>{ points+=scoreForMatch(1); board[i]=0; const cell=boardEl.children[i]; if(cell)cell.classList.add('vanish'); });
  score+=points*combo;
  renderBoard(); setTimeout(()=>{ board=collapseBoard(board); renderBoard(board); processing=false; processMatches(); sndClear.currentTime=0; sndClear.play(); },250);
}

document.getElementById('startBtn').onclick=startGame;
document.getElementById('pauseBtn').onclick=()=>{ if(!running)return; document.getElementById('pauseOverlay').style.display='flex'; clearInterval(timerId); bgm.pause();}
document.getElementById('resumeBtn').onclick=()=>{ document.getElementById('pauseOverlay').style.display='none'; timerId=setInterval(()=>{ timeLeft--; updateUI(); if(timeLeft<=0)endGame(); },1000); bgm.play();}
document.getElementById('muteBtn').onclick=()=>{ bgm.muted=!bgm.muted; document.getElementById('muteBtn').textContent=bgm.muted?'🔇':'🔊'; }
document.getElementById('rankingBtn').onclick=()=>{ document.getElementById('rankingOverlay').style.display='flex'; loadRanking(); }
document.getElementById('closeRanking').onclick=()=>{ document.getElementById('rankingOverlay').style.display='none'; }

async function loadRanking(){
  const res=await fetch(`${API_BASE_URL}ranking`);
  const data=await res.json();
  const listEl=document.getElementById('rankingList'); listEl.innerHTML='';
  data.slice(0,20).forEach((p,i)=>{ listEl.innerHTML+=`<div>${i+1}. ${escapeHtml(p.name)} : ${p.score}</div>`; });
}

board=generateBoard();
renderBoard();
updateUI();
</script>
</body>
</html>
