<!doctype html> 
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Match-3 Mobile Swipe</title>
<style>
:root { --cols:8; --rows:8; --tile-size:11vw; }
html,body {
  margin:0; padding:0; width:100%; height:100%;
  overflow:hidden; overscroll-behavior:none;
  background:#111; color:#fff; font-family:sans-serif;
}
.wrap { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5vw; font-size:3.6vw; font-weight:600; }
.panel { background:rgba(255,255,255,0.04); padding:0.8vw 1.5vw; border-radius:12px; min-width:28vw; text-align:center; }
#combo {color:#ffde59;font-weight:900;font-size:3.5vw;}
.board {background:linear-gradient(180deg,rgba(255,255,255,0.03),transparent);padding:6px;border-radius:10px;
display:grid;grid-template-columns:repeat(var(--cols),var(--tile-size));gap:4px;touch-action:none;box-sizing:border-box;}
.cell {width:var(--tile-size);height:var(--tile-size);border-radius:8px;overflow:hidden;background:#111a2a;
display:flex;align-items:center;justify-content:center;}
.cell img {width:100%;height:100%;object-fit:cover;pointer-events:none;}
@keyframes vanish {0%{transform:scale(1);opacity:1;}50%{transform:scale(1.25);opacity:0.6;}100%{transform:scale(0);opacity:0;}}
.vanish {animation:vanish 180ms cubic-bezier(.2,.9,.3,1) forwards;}
.start-overlay,#gameOverOverlay {
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.35);border-radius:10px;flex-direction:column;z-index:10;
}
.start-btn {background:linear-gradient(90deg,#ff7ab6,#7b61ff);border:none;
padding:14px 26px;border-radius:999px;font-size:1.8rem;color:#fff;cursor:pointer;}
#gameOverOverlay {font-size:10vw;font-weight:900;flex-wrap:wrap;gap:1vw;text-align:center;display:none;}
.bottom-buttons {display:flex;justify-content:center;align-items:center;gap:1.5rem;margin-top:0.8rem;}
.icon-btn {background:none;border:none;font-size:2.8rem;color:white;cursor:pointer;}
.pause-overlay {position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:black;z-index:20;
flex-direction:column;color:white;font-size:1.5rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="panel">Score: <span id="score">0</span></div>
    <div class="panel">残り <span id="time">60</span> 秒</div>
    <div class="panel"><span id="combo"></span></div>
  </div>
  <div id="boardWrap" style="position:relative;">
    <div id="board" class="board"></div>
    <div id="overlay" class="start-overlay">
      <button id="startBtn" class="start-btn">START</button>
    </div>
    <div id="pauseOverlay" class="pause-overlay">
      <div id="pauseText">一時停止中</div>
      <button id="resumeBtn" class="start-btn">▶</button>
    </div>
    <div id="gameOverOverlay"></div>
  </div>
  <div class="bottom-buttons">
    <button id="muteBtn" class="icon-btn">🔇</button>
    <button id="pauseBtn" class="icon-btn">⏸</button>
    <button id="rankingBtn" class="icon-btn">🏆</button>
  </div>
</div>

<audio id="sndStart" src="s.mp3" preload="auto"></audio>
<audio id="sndClear" src="cc.mp3" preload="auto"></audio>
<audio id="bgm" src="bgm2.mp3" preload="auto" loop></audio>

<script>
const ROWS=8, COLS=8, TILE_TYPES=6, GAME_TIME=60;
let board=[],running=false,score=0,timeLeft=GAME_TIME,combo=1,processing=false,timerId;
const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const comboEl=document.getElementById('combo');
const overlay=document.getElementById('overlay');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const sndStart=document.getElementById('sndStart');
const sndClear=document.getElementById('sndClear');
const bgm=document.getElementById('bgm');
bgm.volume=0.2;
const API_BASE_URL='https://junkhin.com/api/';

function idx(r,c){return r*COLS+c;}
function rc(i){return [Math.floor(i/COLS),i%COLS];}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

// 盤面生成（初期3つ以上連続なし）
function generateBoard(){
  const b=new Array(ROWS*COLS).fill(0);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let t, attempts=0;
      while(true){
        t=randInt(1,TILE_TYPES);
        b[idx(r,c)]=t;
        let bad=(c>=2 && b[idx(r,c-1)]===t && b[idx(r,c-2)]===t)||(r>=2 && b[idx(r-1,c)]===t && b[idx(r-2,c)]===t);
        if(!bad) break;
        attempts++; if(attempts>50) break;
      }
    }
  }
  return b;
}

// 盤面描画
function renderBoard(){
  boardEl.innerHTML='';
  board.forEach((t,i)=>{
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.i=i;
    const img=document.createElement('img');
    img.src=`tile${t}.png`;
    cell.appendChild(img);
    boardEl.appendChild(cell);
  });
}

// マッチ判定
function findMatches(b){
  const clear=new Set();
  for(let r=0;r<ROWS;r++){
    let runT=null, runS=0, runL=0;
    for(let c=0;c<COLS;c++){
      const t=b[idx(r,c)];
      if(t===runT) runL++; else { if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(r,runS+k)); runT=t; runS=c; runL=1; }
    }
    if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(r,runS+k));
  }
  for(let c=0;c<COLS;c++){
    let runT=null, runS=0, runL=0;
    for(let r=0;r<ROWS;r++){
      const t=b[idx(r,c)];
      if(t===runT) runL++; else { if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(runS+k,c)); runT=t; runS=r; runL=1; }
    }
    if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(runS+k,c));
  }
  return Array.from(clear).sort((a,b)=>a-b);
}

// スワップ判定
function isAdjacent(i1,i2){const [r1,c1]=rc(i1),[r2,c2]=rc(i2);return Math.abs(r1-r2)+Math.abs(c1-c2)===1;}
function swapTiles(i1,i2){[board[i1],board[i2]]=[board[i2],board[i1]];renderBoard();}

// スコア計算
function scoreForMatch(count){switch(count){case 3:return 100;case 4:return 300;case 5:return 500;default:return 500+(count-5)*100;}}

// UI更新
function updateUI(){scoreEl.textContent=score;timeEl.textContent=timeLeft;comboEl.textContent=combo>1?`${combo}コンボ！`:'';}

// タッチ操作
let touchStartIndex=null,startX=0,startY=0;
boardEl.addEventListener('touchstart',e=>{
  if(!running||processing) return;
  const t=e.target.closest('.cell'); if(!t) return;
  touchStartIndex=Number(t.dataset.i);
  startX=e.touches[0].clientX; startY=e.touches[0].clientY;
},{passive:false});
boardEl.addEventListener('touchmove',e=>{ if(touchStartIndex!==null) e.preventDefault(); },{passive:false});
boardEl.addEventListener('touchend',e=>{
  if(touchStartIndex===null||!running||processing) return;
  const dx=e.changedTouches[0].clientX-startX;
  const dy=e.changedTouches[0].clientY-startY;
  if(Math.max(Math.abs(dx),Math.abs(dy))<20){ touchStartIndex=null; return; }
  const [r,c]=rc(touchStartIndex);
  let targetR=r,targetC=c;
  if(Math.abs(dx)>Math.abs(dy)) targetC+=dx>0?1:-1; else targetR+=dy>0?1:-1;
  if(targetR<0||targetR>=ROWS||targetC<0||targetC>=COLS){ touchStartIndex=null; return; }
  const targetIndex=idx(targetR,targetC);
  playerMove(touchStartIndex,targetIndex);
  touchStartIndex=null;
},{passive:false});

// プレイヤー移動
async function playerMove(i1,i2){
  if(!running||processing||!isAdjacent(i1,i2)) return;
  processing=true;
  const newB=[...board]; [newB[i1],newB[i2]]=[newB[i2],newB[i1]];
  if(findMatches(newB).length===0){swapTiles(i1,i2);await new Promise(r=>setTimeout(r,300));swapTiles(i1,i2); processing=false; return; }
  swapTiles(i1,i2); sndClear.currentTime=0;sndClear.play();
  let chain=0;
  while(true){
    const matches=findMatches(board); if(matches.length===0) break; chain++; combo=Math.min(10,chain);
    let gained=0; matches.forEach(i=>gained+=scoreForMatch(3)*chain); score+=gained;
    matches.forEach(i=>board[i]=0);
    board=collapseBoard(board); renderBoard();
    await new Promise(r=>setTimeout(r,350));
  }
  updateUI(); processing=false;
}

// ボード落下
function collapseBoard(b){
  const nb=[...b];
  for(let c=0;c<COLS;c++){
    let emptyRow=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(nb[idx(r,c)]!==0){ nb[idx(emptyRow,c)]=nb[idx(r,c)]; if(emptyRow!==r) nb[idx(r,c)]=0; emptyRow--; }
    }
    for(let r=emptyRow;r>=0;r--) nb[idx(r,c)]=randInt(1,TILE_TYPES);
  }
  return nb;
}

// ゲーム開始
function startGame(){
  board=generateBoard(); renderBoard();
  score=0; combo=1; timeLeft=GAME_TIME; processing=false; running=true;
  updateUI(); overlay.style.display='none'; gameOverOverlay.style.display='none';
  sndStart.currentTime=0; sndStart.play(); bgm.currentTime=0; bgm.play();
  timerId=setInterval(()=>{
    timeLeft--; if(timeLeft<=0){ clearInterval(timerId); running=false; showGameOver(); } updateUI();
  },1000);
}

// ゲーム終了
function showGameOver(){
  running=false; clearInterval(timerId); bgm.pause();
  gameOverOverlay.style.display='flex';
  gameOverOverlay.textContent=`GAME OVER\nScore: ${score}`;
}

// 一時停止
document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!running) return;
  running=false;
  clearInterval(timerId);
  document.getElementById('pauseOverlay').style.display='flex';
});
document.getElementById('resumeBtn').addEventListener('click',()=>{
  document.getElementById('pauseOverlay').style.display='none';
  running=true;
  timerId=setInterval(()=>{
    timeLeft--; if(timeLeft<=0){ clearInterval(timerId); running=false; showGameOver(); } updateUI();
  },1000);
});

// 音量ON/OFF
let muted=false;
document.getElementById('muteBtn').addEventListener('click',()=>{
  muted=!muted;
  bgm.muted=muted; sndStart.muted=muted; sndClear.muted=muted;
  document.getElementById('muteBtn').textContent=muted?'🔊':'🔇';
});

// スタートボタン
document.getElementById('startBtn').addEventListener('click',startGame);

// 登録（仮のAPI呼び出し例）
async function registerScore(name){
  try{
    const res=await fetch(`${API_BASE_URL}register?name=${encodeURIComponent(name)}&score=${score}`);
    if(!res.ok) throw new Error('通信失敗');
    return true;
  }catch(e){console.warn(e); return true;} // 実際に登録できるならtrue返す
}

// ランキングボタン（仮）
document.getElementById('rankingBtn').addEventListener('click',()=>alert('ランキング表示'));

// ページロード時も盤面描画
board=generateBoard(); renderBoard();
</script>
</body>
</html>
