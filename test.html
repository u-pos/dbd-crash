<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Match-3 Mobile Swipe</title>
<style>
:root { --cols:8; --rows:8; --tile-size:11vw; }
html,body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none; background:#111; color:#fff; font-family:sans-serif; }
.wrap { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5vw; font-size:3.6vw; font-weight:600; }
.panel { background:rgba(255,255,255,0.04); padding:0.8vw 1.5vw; border-radius:12px; min-width:28vw; text-align:center; }
#combo {color:#ffde59;font-weight:900;font-size:3.5vw;}
.board {background:linear-gradient(180deg,rgba(255,255,255,0.03),transparent);padding:6px;border-radius:10px; display:grid;grid-template-columns:repeat(var(--cols),var(--tile-size));gap:4px;touch-action:none;box-sizing:border-box;}
.cell {width:var(--tile-size);height:var(--tile-size);border-radius:8px;overflow:hidden;background:#111a2a; display:flex;align-items:center;justify-content:center;}
.cell img {width:100%;height:100%;object-fit:cover;pointer-events:none;}
@keyframes vanish {0%{transform:scale(1);opacity:1;}50%{transform:scale(1.25);opacity:0.6;}100%{transform:scale(0);opacity:0;}}
.vanish {animation:vanish 180ms cubic-bezier(.2,.9,.3,1) forwards;}
.start-overlay,#gameOverOverlay { position:absolute;inset:0;display:flex;align-items:center;justify-content:center; background:rgba(0,0,0,0.35);border-radius:10px;flex-direction:column;z-index:10; }
.start-btn {background:linear-gradient(90deg,#ff7ab6,#7b61ff);border:none; padding:14px 26px;border-radius:999px;font-size:1.8rem;color:#fff;cursor:pointer;}
#gameOverOverlay {font-size:10vw;font-weight:900;flex-wrap:wrap;gap:1vw;text-align:center;}
.bottom-buttons {display:flex;justify-content:center;align-items:center;gap:1.5rem;margin-top:0.8rem;}
.icon-btn {background:none;border:none;font-size:2.8rem;color:white;cursor:pointer;}
.rules-table-fixed {margin-top:0.5rem;font-size:0.75rem;width:100%;}
.rules-table-fixed table {width:100%;color:#fff;border-collapse:collapse;text-align:center;}
.rules-table-fixed th,.rules-table-fixed td {border-bottom:1px solid #555;padding:0.2rem;}
.rules-table-fixed th {border-bottom:2px solid #ffde59;}
.pause-overlay {position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:black;z-index:20; flex-direction:column;color:white;font-size:1.5rem;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="panel">Score: <span id="score">0</span></div>
    <div class="panel">残り <span id="time">60</span> 秒</div>
    <div class="panel"><span id="combo"></span></div>
  </div>
  <div id="boardWrap" style="position:relative;">
    <div id="board" class="board"></div>
    <div id="overlay" class="start-overlay">
      <button id="startBtn" class="start-btn">START</button>
    </div>
    <div id="pauseOverlay" class="pause-overlay">
      <div id="pauseText">一時停止中</div>
      <button id="resumeBtn" class="start-btn">▶</button>
    </div>
    <div id="gameOverOverlay" style="display:none;"></div>
  </div>
  <div class="bottom-buttons">
    <button id="muteBtn" class="icon-btn">🔇</button>
    <button id="pauseBtn" class="icon-btn">⏸</button>
  </div>
  <div class="rules-table-fixed">
    <table>
      <thead><tr><th>得点ルール</th><th>内容</th></tr></thead>
      <tbody>
        <tr><td>3個消し</td><td>100点</td></tr>
        <tr><td>4個消し</td><td>300点</td></tr>
        <tr><td>5個消し</td><td>500点</td></tr>
        <tr><td colspan="2">2コンボ目は得点2倍、3コンボ目は得点3倍。</td></tr>
      </tbody>
    </table>
  </div>
</div>

<audio id="sndStart" src="s.mp3" preload="auto"></audio>
<audio id="sndClear" src="cc.mp3" preload="auto"></audio>
<audio id="bgm" src="bgm2.mp3" preload="auto" loop></audio>

<script>
const ROWS=8, COLS=8, TILE_TYPES=6, GAME_TIME=60;
let board=[], running=false, score=0, timeLeft=GAME_TIME, timerId, combo=1, processing=false;
const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const comboEl=document.getElementById('combo');
const overlay=document.getElementById('overlay');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const sndStart=document.getElementById('sndStart');
const sndClear=document.getElementById('sndClear');
const bgm=document.getElementById('bgm');
bgm.volume=0.2;

function idx(r,c){return r*COLS+c}
function rc(i){return [Math.floor(i/COLS),i%COLS]}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function generateBoard(){
  const b=new Array(ROWS*COLS).fill(0);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let attempts=0;
      while(true){
        const t=randInt(1,TILE_TYPES);
        b[idx(r,c)]=t;
        let bad=false;
        if(c>=2 && b[idx(r,c-1)]==t && b[idx(r,c-2)]==t) bad=true;
        if(r>=2 && b[idx(r-1,c)]==t && b[idx(r-2,c)]==t) bad=true;
        if(!bad) break;
        attempts++; if(attempts>50) break;
      }
    }
  }
  return b;
}

function findMatches(b){
  const clear=new Set();
  for(let r=0;r<ROWS;r++){
    let runT=null, runS=0, runL=0;
    for(let c=0;c<COLS;c++){
      const t=b[idx(r,c)];
      if(t===runT) runL++;
      else { if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(r,runS+k)); runT=t; runS=c; runL=1; }
    }
    if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(r,runS+k));
  }
  for(let c=0;c<COLS;c++){
    let runT=null, runS=0, runL=0;
    for(let r=0;r<ROWS;r++){
      const t=b[idx(r,c)];
      if(t===runT) runL++;
      else { if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(runS+k,c)); runT=t; runS=r; runL=1; }
    }
    if(runT && runL>=3) for(let k=0;k<runL;k++) clear.add(idx(runS+k,c));
  }
  return Array.from(clear).sort((a,b)=>a-b);
}

function collapseBoard(b){
  const nb=b.slice();
  for(let c=0;c<COLS;c++){
    let emptyRow=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(nb[idx(r,c)]!==0){
        nb[idx(emptyRow,c)]=nb[idx(r,c)];
        if(emptyRow!==r) nb[idx(r,c)]=0;
        emptyRow--;
      }
    }
    for(let r=emptyRow;r>=0;r--) nb[idx(r,c)]=randInt(1,TILE_TYPES);
  }
  return nb;
}

function scoreForMatch(count){
  switch(count){
    case 3:return 100;
    case 4:return 300;
    case 5:return 500;
    default:return 500+(count-5)*100;
  }
}

function renderBoard(prevBoard){
  boardEl.innerHTML='';
  for(let i=0;i<board.length;i++){
    const t=board[i];
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.i=i;
    if(t>0){
      const img=document.createElement('img');
      img.src=`tile${t}.png`;
      if(prevBoard && prevBoard[i]===0){
        img.style.opacity='0';
        img.style.transform='translateY(-120%)';
        requestAnimationFrame(()=>{ img.style.transition='transform 0.4s ease, opacity 0.4s ease'; img.style.transform='translateY(0)'; img.style.opacity='1'; });
      }
      cell.appendChild(img);
    }
    boardEl.appendChild(cell);
  }
}

function updateUI(){ scoreEl.textContent=score; timeEl.textContent=timeLeft; comboEl.textContent=combo>1?`${combo}コンボ！`:''; }

function startGame(){
  overlay.style.display='none';
  gameOverOverlay.style.display='none';
  board=generateBoard(); score=0; timeLeft=GAME_TIME; combo=1; processing=false;
  running=true; updateUI(); renderBoard();
  sndStart.currentTime=0; sndStart.play();
  timerId=setInterval(()=>{ timeLeft--; if(timeLeft<=0){ clearInterval(timerId); running=false; showGameOver(); } updateUI(); },1000);
}

function showGameOver(){
  bgm.pause();
  gameOverOverlay.style.display='flex';
  gameOverOverlay.innerHTML=`
    <div>最終スコア</div>
    <div style="font-size:15vw; font-weight:900;">${score}</div>
    <button id="registerBtn" class="start-btn">登録</button>
  `;
  document.getElementById('registerBtn').onclick = async ()=>{
    const name = prompt("名前を入力してください");
    if(!name) return;
    // 仮API送信
    try { await fetch(`https://junkhin.com/api/register?name=${encodeURIComponent(name)}&score=${score}`); } catch(e){console.warn(e);}
    alert("登録成功！");
    // ボタンを再挑戦に切り替え
    const startBtn=document.getElementById('startBtn');
    startBtn.textContent="再挑戦";
    startBtn.onclick = ()=>{ score=0; combo=1; timeLeft=GAME_TIME; updateUI(); startGame(); };
  };
}

// タッチ操作
let touchStartIndex=null,startX=0,startY=0;
boardEl.addEventListener('touchstart',e=>{
  if(!running||processing) return;
  const t=e.target.closest('.cell'); if(!t) return;
  touchStartIndex=Number(t.dataset.i); startX=e.touches[0].clientX; startY=e.touches[0].clientY;
},{passive:false});
boardEl.addEventListener('touchmove',e=>{ if(touchStartIndex!==null) e.preventDefault(); },{passive:false});
boardEl.addEventListener('touchend',e=>{
  if(touchStartIndex===null||!running||processing){ touchStartIndex=null; return; }
  const dx=e.changedTouches[0].clientX-startX;
  const dy=e.changedTouches[0].clientY-startY;
  const absDx=Math.abs(dx), absDy=Math.abs(dy);
  if(Math.max(absDx,absDy)<20){ touchStartIndex=null; return; }
  const [r,c]=rc(touchStartIndex);
  let targetR=r, targetC=c;
  if(absDx>absDy) targetC+=(dx>0?1:-1);
  else targetR+=(dy>0?1:-1);
  if(targetR<0||targetR>=ROWS||targetC<0||targetC>=COLS){ touchStartIndex=null; return; }
  const targetIdx=idx(targetR,targetC);
  swapAndProcess(touchStartIndex,targetIdx);
  touchStartIndex=null;
});

function swapAndProcess(i1,i2){
  processing=true;
  [board[i1],board[i2]]=[board[i2],board[i1]];
  let matches=findMatches(board);
  if(matches.length===0){ [board[i1],board[i2]]=[board[i2],board[i1]]; processing=false; return; }
  processMatches(matches);
}

async function processMatches(matches){
  while(matches.length>0){
    for(const i of matches){
      const cell=boardEl.children[i]; if(cell) cell.firstChild?.classList.add('vanish');
      board[i]=0;
    }
    const pts=matches.length>=3?scoreForMatch(matches.length)*combo:0;
    score+=pts;
    if(matches.length>=3) combo++;
    renderBoard(board);
    sndClear.currentTime=0; sndClear.play();
    await new Promise(r=>setTimeout(r,220));
    board=collapseBoard(board);
    renderBoard();
    await new Promise(r=>setTimeout(r,400));
    matches=findMatches(board);
  }
  combo=1;
  processing=false;
  updateUI();
}

// UIボタン
document.getElementById('startBtn').onclick=startGame;
document.getElementById('pauseBtn').onclick=()=>{ document.getElementById('pauseOverlay').style.display='flex'; running=false; clearInterval(timerId); };
document.getElementById('resumeBtn').onclick=()=>{ document.getElementById('pauseOverlay').style.display='none'; running=true; timerId=setInterval(()=>{ timeLeft--; if(timeLeft<=0){ clearInterval(timerId); running=false; showGameOver(); } updateUI(); },1000); };
document.getElementById('muteBtn').onclick=()=>{ bgm.muted=!bgm.muted; document.getElementById('muteBtn').textContent=bgm.muted?'🔈':'🔇'; };

</script>
</body>
</html>
