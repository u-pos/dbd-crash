<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>Match-3 Mobile Swipe</title>
<style>
:root { --cols:8; --rows:8; --tile-size:11vw; }
html,body {margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:sans-serif;}
.wrap {width:100%;height:100%;display:flex;flex-direction:column;align-items:center;}
.header {display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5vw;font-size:3.6vw;font-weight:600;}
.panel {background:rgba(255,255,255,0.04);padding:0.8vw 1.5vw;border-radius:12px;min-width:28vw;text-align:center;}
#combo {color:#ffde59;font-weight:900;font-size:3.5vw;}
.board {background:linear-gradient(180deg,rgba(255,255,255,0.03),transparent);padding:6px;border-radius:10px;
display:grid;grid-template-columns:repeat(var(--cols),var(--tile-size));gap:4px;touch-action:none;box-sizing:border-box;}
.cell {width:var(--tile-size);height:var(--tile-size);border-radius:8px;overflow:hidden;background:#111a2a;
display:flex;align-items:center;justify-content:center;}
.cell img {width:100%;height:100%;object-fit:cover;pointer-events:none;}
.vanish {animation:vanish 180ms cubic-bezier(.2,.9,.3,1) forwards;}
@keyframes vanish {0%{transform:scale(1);opacity:1;}50%{transform:scale(1.25);opacity:0.6;}100%{transform:scale(0);opacity:0;}}
.start-overlay,#gameOverOverlay {position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
background:rgba(0,0,0,0.35);border-radius:10px;flex-direction:column;z-index:10;}
.start-btn {background:linear-gradient(90deg,#ff7ab6,#7b61ff);border:none;padding:14px 26px;border-radius:999px;font-size:1.8rem;color:#fff;cursor:pointer;}
#gameOverOverlay {font-size:10vw;font-weight:900;flex-wrap:wrap;gap:1vw;text-align:center;display:none;}
.bottom-buttons {display:flex;justify-content:center;align-items:center;gap:1.5rem;margin-top:0.8rem;}
.icon-btn {background:none;border:none;font-size:2.8rem;color:white;cursor:pointer;}
.pause-overlay {position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:black;z-index:20;
flex-direction:column;color:white;font-size:1.5rem;}
#rankingOverlay {position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; display: none; justify-content: center; align-items: center;}
.ranking-content {background: rgba(255,255,255,0.95); color: #000; padding: 1rem; border-radius: 8px; width: 80%; max-width: 500px; display: flex; flex-direction: column; max-height: 80%; overflow-y: auto;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="panel">Score: <span id="score">0</span></div>
    <div class="panel">残り <span id="time">60</span> 秒</div>
    <div class="panel"><span id="combo"></span></div>
  </div>
  <div id="boardWrap" style="position:relative;">
    <div id="board" class="board"></div>
    <div id="overlay" class="start-overlay">
      <button id="startBtn" class="start-btn">START</button>
    </div>
    <div id="pauseOverlay" class="pause-overlay">
      <div id="pauseText">一時停止中</div>
      <button id="resumeBtn" class="start-btn">▶</button>
    </div>
    <div id="gameOverOverlay"></div>
  </div>
  <div class="bottom-buttons">
    <button id="muteBtn" class="icon-btn">🔇</button>
    <button id="pauseBtn" class="icon-btn">⏸</button>
    <button id="rankingBtn" class="icon-btn">🏆</button>
  </div>
</div>

<div id="rankingOverlay">
  <div class="ranking-content">
    <button id="closeRanking" class="icon-btn" style="font-size:2rem;align-self:flex-end;">✖</button>
    <h2 style="text-align:center;">🏆 ランキング TOP15 🏆</h2>
    <div id="rankingList" style="font-size:4vw;"></div>
  </div>
</div>

<audio id="sndStart" src="s.mp3" preload="auto"></audio>
<audio id="sndClear" src="cc.mp3" preload="auto"></audio>
<audio id="bgm" src="bgm2.mp3" preload="auto" loop></audio>

<script>
const API_BASE_URL='https://junkhin.com/api/';
function escapeHtml(str){return str.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function sleep(ms){return new Promise(res=>setTimeout(res,ms));}

// --- ランキング ---
async function loadRanking(){
  try{
    const res = await fetch(API_BASE_URL+'get_scores.php');
    const data = await res.json();
    let html = '<ol>';
    if(data.success){
      data.scores.forEach(s=>{html += `<li>${escapeHtml(s.name)} - ${s.score}</li>`;});
    }
    html += '</ol>';
    document.getElementById('rankingList').innerHTML = html;
  }catch(e){
    document.getElementById('rankingList').innerHTML='<p>取得失敗</p>';
  }
}
document.getElementById('rankingBtn').addEventListener('click',()=>{
  loadRanking();
  document.getElementById('rankingOverlay').style.display='flex';
});
document.getElementById('closeRanking').addEventListener('click',()=>{
  document.getElementById('rankingOverlay').style.display='none';
});

// --- ゲームロジック ---
const ROWS=8,COLS=8,TILE_TYPES=6,GAME_TIME=60;
let board=[],running=false,score=0,timeLeft=GAME_TIME,combo=1,processing=false,timerId;
const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const comboEl=document.getElementById('combo');
const overlay=document.getElementById('overlay');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const sndStart=document.getElementById('sndStart');
const sndClear=document.getElementById('sndClear');
const bgm=document.getElementById('bgm'); bgm.volume=0.2;

function idx(r,c){return r*COLS+c;}
function rc(i){return [Math.floor(i/COLS),i%COLS];}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function generateBoard(){
  const b=new Array(ROWS*COLS).fill(0);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let t;
      let attempts=0;
      do{
        t=randInt(1,TILE_TYPES);
        let bad=false;
        if(c>=2 && b[idx(r,c-1)]==t && b[idx(r,c-2)]==t) bad=true;
        if(r>=2 && b[idx(r-1,c)]==t && b[idx(r-2,c)]==t) bad=true;
        if(!bad) break;
        attempts++; if(attempts>50) break;
      }while(true);
      b[idx(r,c)]=t;
    }
  }
  return b;
}

function renderBoard(prevBoard){
  boardEl.innerHTML='';
  for(let i=0;i<board.length;i++){
    const t=board[i];
    const cell=document.createElement('div'); cell.className='cell'; cell.dataset.i=i;
    if(t>0){
      const img=document.createElement('img'); img.src=`tile${t}.png`;
      if(prevBoard && prevBoard[i]===0){img.style.opacity='0';img.style.transform='translateY(-120%)';
        requestAnimationFrame(()=>{img.style.transition='transform 0.4s, opacity 0.4s'; img.style.transform='translateY(0)'; img.style.opacity='1';});
      }
      cell.appendChild(img);
    }
    boardEl.appendChild(cell);
  }
}

function startGame(){
  overlay.style.display='none';
  gameOverOverlay.style.display='none';
  document.getElementById('rankingOverlay').style.display='none';
  bgm.currentTime=0; bgm.play().catch(()=>{});
  board=generateBoard(); score=0; timeLeft=GAME_TIME; combo=1; processing=false;
  running=true; updateUI(); renderBoard();
  sndStart.currentTime=0; sndStart.play();
  timerId=setInterval(()=>{
    timeLeft--; updateUI();
    if(timeLeft<=0){ clearInterval(timerId); running=false; showGameOver(); }
  },1000);
}

function updateUI(){
  scoreEl.textContent=score; timeEl.textContent=timeLeft;
  comboEl.textContent=combo>1?`${combo}コンボ！`:'';
}

// --- ゲームオーバー処理 ---
// --- ゲームオーバー処理 ---
async function showGameOver(){
  bgm.pause();
  try{
    const resRank=await fetch(API_BASE_URL+'check_rank.php',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({score})});
    const data=await resRank.json();
   // gameOverOverlay を上書きせずに子要素だけ操作
gameOverOverlay.style.display='flex';
gameOverOverlay.innerHTML=''; // まず内部をクリア

const scoreDiv = document.createElement('div');
scoreDiv.textContent = `最終スコア: ${score}`;
scoreDiv.style.fontSize='15vw';
scoreDiv.style.fontWeight='900';
gameOverOverlay.appendChild(scoreDiv);

if(data.success && data.entersTop15){
    const input = document.createElement('input');
    input.type='text';
    input.id='playerName';
    input.placeholder='名前を入力';
    input.style.fontSize='5vw';
    input.style.margin='1rem 0';
    gameOverOverlay.appendChild(input);

    const saveBtn = document.createElement('button');
    saveBtn.id='saveNameBtn';
    saveBtn.className='start-btn';
    saveBtn.textContent='登録';
    gameOverOverlay.appendChild(saveBtn);

    saveBtn.onclick = async () => {
        const name = input.value.trim();
        if(!name){ alert('名前を入力してください'); return; }
        const resSave = await fetch(API_BASE_URL+'save_score.php',{
            method:'POST',
            headers:{'Content-Type':'application/x-www-form-urlencoded'},
            body: new URLSearchParams({name, score})
        });
        const saveData = await resSave.json();
        if(saveData.success){
            alert('登録完了しました');
            // 登録後、ボタンだけ差し替え
            const restartBtn = document.createElement('button');
            restartBtn.id='restartBtn';
            restartBtn.className='start-btn';
            restartBtn.textContent='RESTART';
            restartBtn.onclick = () => { startGame(); gameOverOverlay.style.display='none'; };
            // 古いボタンを置き換える
            saveBtn.replaceWith(restartBtn);
            loadRanking();
        } else {
            alert(saveData.error || '登録失敗');
        }
    }
} else {
    const restartBtn = document.createElement('button');
    restartBtn.id='restartBtn';
    restartBtn.className='start-btn';
    restartBtn.textContent='RESTART';
    restartBtn.onclick = () => { startGame(); gameOverOverlay.style.display='none'; };
    gameOverOverlay.appendChild(restartBtn);
}

// --- ランキングTOP15に修正 ---
async function loadRanking(){
  try{
    const res = await fetch(API_BASE_URL+'get_scores.php');
    const data = await res.json();
    let html = '<ol>';
    if(data.success){
      data.scores.slice(0,15).forEach(s=>{ // TOP15まで
        html += `<li>${escapeHtml(s.name)} - ${s.score}</li>`;
      });
    }
    html += '</ol>';
    document.getElementById('rankingList').innerHTML = html;
  }catch(e){
    document.getElementById('rankingList').innerHTML='<p>取得失敗</p>';
  }
}

// --- 初期描画 ---
board=generateBoard(); renderBoard(); updateUI();
document.getElementById('startBtn').addEventListener('click',startGame);

// --- ミュート／一時停止 ---
let muted=false;
document.getElementById('muteBtn').addEventListener('click',()=>{
  muted=!muted; bgm.muted=muted; sndClear.muted=muted; sndStart.muted=muted;
  document.getElementById('muteBtn').textContent=muted?'🔈':'🔇';
});
const pauseOverlayEl=document.getElementById('pauseOverlay');
document.getElementById('pauseBtn').addEventListener('click',()=>{
  if(!running) return;
  clearInterval(timerId); running=false; bgm.pause(); pauseOverlayEl.style.display='flex';
});
document.getElementById('resumeBtn').addEventListener('click',()=>{
  running=true; pauseOverlayEl.style.display='none'; bgm.play().catch(()=>{});
  timerId=setInterval(()=>{ timeLeft--; updateUI(); if(timeLeft<=0){ clearInterval(timerId); running=false; showGameOver(); } },1000);
});
document.addEventListener('touchmove', e=>e.preventDefault(), {passive:false});
</script>
</body>
</html>
