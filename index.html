<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBDガチ勢チェックテスト（例ゲーム版）</title>
<style>
body,html{margin:0;padding:0;width:100%;height:100%;background:black;color:white;font-family:sans-serif;}
.wrap{display:flex;flex-direction:column;align-items:center;width:100%;height:100%;}
#boardWrap{position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;}
.board{display:grid;grid-template-columns:repeat(8,11vw);grid-gap:4px;}
.cell{width:11vw;height:11vw;background:#111a2a;border-radius:8px;display:flex;align-items:center;justify-content:center;}
.cell img{width:100%;height:100%;object-fit:cover;pointer-events:none;}
.start-overlay,#gameOverOverlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);flex-direction:column;z-index:10;}
.start-btn{padding:14px 26px;border-radius:999px;font-size:1.8rem;color:#fff;background:linear-gradient(90deg,#ff7ab6,#7b61ff);border:none;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div id="boardWrap">
    <div id="board" class="board"></div>
    <div id="overlay" class="start-overlay">
      <button id="startBtn" class="start-btn">START</button>
    </div>
    <div id="gameOverOverlay" class="start-overlay" style="display:none;"></div>
  </div>
</div>

<audio id="bgm" src="bgm2.mp3" preload="auto" loop></audio>

<script>
const ROWS=8,COLS=8,TILE_TYPES=6,GAME_TIME=60;
let board=[],running=false,score=0,timeLeft=GAME_TIME,timerId,combo=1,processing=false;
const boardEl=document.getElementById('board');
const overlay=document.getElementById('overlay');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const bgm=document.getElementById('bgm');
bgm.volume=0.2;

function idx(r,c){return r*COLS+c;}
function rc(i){return [Math.floor(i/COLS),i%COLS];}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

function generateBoard(){
  const b=new Array(ROWS*COLS).fill(0);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let attempts=0;
      while(true){
        const t=randInt(1,TILE_TYPES);
        b[idx(r,c)]=t;
        let bad=false;
        if(c>=2 && b[idx(r,c-1)]==t && b[idx(r,c-2)]==t) bad=true;
        if(r>=2 && b[idx(r-1,c)]==t && b[idx(r-2,c)]==t) bad=true;
        if(!bad) break;
        attempts++; if(attempts>50) break;
      }
    }
  }
  return b;
}

function renderBoard(){
  boardEl.innerHTML='';
  for(let i=0;i<board.length;i++){
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.i=i;
    const img=document.createElement('img');
    img.src=`tile${board[i]}.png`;
    cell.appendChild(img);
    boardEl.appendChild(cell);
  }
}

function startGame(){
  overlay.style.display='none';
  gameOverOverlay.style.display='none';
  board=generateBoard(); score=0; timeLeft=GAME_TIME; combo=1; processing=false; running=true;
  renderBoard();
  bgm.currentTime=0; bgm.play().catch(()=>{});
  timerId=setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){ clearInterval(timerId); running=false; showGameOver(); }
  },1000);
}

// --- ダミー関数: マッチ判定など省略 ---
function playerMove(i1,i2){}

// --- ゲームオーバー処理 ---
function showGameOver(){
  gameOverOverlay.style.display='flex';
  gameOverOverlay.innerHTML=`<div>最終スコア</div><div style="font-size:15vw;font-weight:900;">${score}</div>`;

  // APIでランクイン判定
  fetch('https://example.com/check_rank.php',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({score})
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.success && data.entersTop20){
      const input=document.createElement('input');
      input.type='text'; input.id='playerName'; input.placeholder='名前を入力';
      input.style.fontSize='5vw'; input.style.margin='1rem 0';
      gameOverOverlay.appendChild(input);

      const saveBtn=document.createElement('button');
      saveBtn.textContent='登録'; saveBtn.className='start-btn';
      gameOverOverlay.appendChild(saveBtn);

      saveBtn.addEventListener('click',()=>{
        const name=document.getElementById('playerName').value || '名無し';
        fetch('https://example.com/save_rank.php',{
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body:new URLSearchParams({score,name})
        })
        .then(r=>r.json())
        .then(resp=>{
          // 登録完了 → 再挑戦ボタン
          gameOverOverlay.innerHTML=`
            <div>登録完了！</div>
            <div style="font-size:15vw;font-weight:900;">${score}</div>
            <button id="restartBtn" class="start-btn">再挑戦</button>
          `;
          document.getElementById('restartBtn').addEventListener('click',()=>{ startGame(); });
        });
      });
    } else {
      // ランクインなしは即再挑戦
      gameOverOverlay.innerHTML+=`<button id="restartBtn" class="start-btn">再挑戦</button>`;
      document.getElementById('restartBtn').addEventListener('click',()=>{ startGame(); });
    }
    bgm.pause();
  });
}

document.getElementById('startBtn').addEventListener('click',startGame);

</script>
</body>
</html>
