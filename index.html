<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Match-3 Game Complete</title>
<style>
html, body { margin:0; padding:0; width:100%; height:100%; background:#111; color:#fff; font-family:sans-serif; overflow:hidden; }
.wrap { display:flex; flex-direction:column; align-items:center; width:100%; height:100%; }
.header { display:flex; justify-content:space-between; align-items:center; width:90%; margin:1vw 0; font-size:3vw; }
.panel { background:rgba(255,255,255,0.05); padding:0.5vw 1vw; border-radius:8px; text-align:center; min-width:20%; }
.board { display:grid; grid-template-columns:repeat(8,11vw); grid-gap:4px; background:linear-gradient(180deg, rgba(255,255,255,0.03), transparent); padding:4px; border-radius:8px; touch-action:none; }
.cell { width:11vw; height:11vw; border-radius:8px; background:#111a2a; display:flex; align-items:center; justify-content:center; overflow:hidden; }
.cell img { width:100%; height:100%; object-fit:cover; pointer-events:none; }
.vanish { animation: vanish 180ms cubic-bezier(.2,.9,.3,1) forwards; }
@keyframes vanish {0%{transform:scale(1);opacity:1;}50%{transform:scale(1.25);opacity:0.6;}100%{transform:scale(0);opacity:0;}}
.start-overlay,#gameOverOverlay { position:absolute; inset:0; display:flex; justify-content:center; align-items:center; background:rgba(0,0,0,0.35); flex-direction:column; z-index:10; border-radius:8px; }
.start-btn { padding:14px 26px; border-radius:999px; font-size:1.8rem; color:#fff; cursor:pointer; border:none; background:linear-gradient(90deg,#ff7ab6,#7b61ff); }
.bottom-buttons { display:flex; justify-content:center; gap:1.5rem; margin-top:0.5rem; }
.icon-btn { background:none; border:none; font-size:2.5rem; color:white; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="panel">Score: <span id="score">0</span></div>
    <div class="panel">残り <span id="time">60</span> 秒</div>
    <div class="panel"><span id="combo"></span></div>
  </div>
<div id="boardWrap" style="position:relative;">
  <!-- ゲーム盤は常に描画 -->
  <div id="board" class="board"></div>

  <!-- スタートオーバーレイ -->
  <div id="overlay" class="start-overlay">
    <button id="startBtn" class="start-btn">START</button>
  </div>

  <!-- ゲームオーバーオーバーレイ -->
  <div id="gameOverOverlay" class="start-overlay" style="display:none;"></div>
</div>

  <div class="bottom-buttons">
    <button id="muteBtn" class="icon-btn">🔇</button>
    <button id="pauseBtn" class="icon-btn">⏸</button>
    <button id="rankingBtn" class="icon-btn">🏆</button>
  </div>
</div>

<!-- ランキングオーバーレイ -->
<div id="rankingOverlay" style="position:fixed; inset:0; background:rgba(0,0,0,0.7); display:none; justify-content:center; align-items:center; z-index:100;">
  <div style="background:rgba(255,255,255,0.95); color:#000; padding:1rem; border-radius:8px; width:80%; max-width:500px; display:flex; flex-direction:column; max-height:80%; overflow-y:auto;">
    <button id="closeRanking" class="icon-btn" style="font-size:2rem; align-self:flex-end;">✖</button>
    <h2 style="text-align:center;">🏆 ランキング TOP20 🏆</h2>
    <div id="rankingList" style="font-size:4vw;"></div>
  </div>
</div>

<audio id="sndStart" src="s.mp3" preload="auto"></audio>
<audio id="sndClear" src="cc.mp3" preload="auto"></audio>
<audio id="bgm" src="bgm2.mp3" preload="auto" loop></audio>

<script>
const API_BASE_URL = 'https://junkhin.com/api/';
const ROWS=8, COLS=8, TILE_TYPES=6, GAME_TIME=60;
let board=[], running=false, score=0, timeLeft=GAME_TIME, timerId, combo=1, processing=false;
const boardEl=document.getElementById('board');
const scoreEl=document.getElementById('score');
const timeEl=document.getElementById('time');
const comboEl=document.getElementById('combo');
const overlay=document.getElementById('overlay');
const gameOverOverlay=document.getElementById('gameOverOverlay');
const sndStart=document.getElementById('sndStart');
const sndClear=document.getElementById('sndClear');
const bgm=document.getElementById('bgm');
bgm.volume=0.2;

// ヘルパー
function idx(r,c){return r*COLS+c;}
function rc(i){return [Math.floor(i/COLS), i%COLS];}
function randInt(min,max){return Math.floor(Math.random()*(max-min+1))+min;}

// ボード生成
function generateBoard(){
  const b=new Array(ROWS*COLS).fill(0);
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      let attempts=0;
      while(true){
        const t=randInt(1,TILE_TYPES);
        b[idx(r,c)]=t;
        let bad=false;
        if(c>=2 && b[idx(r,c-1)]==t && b[idx(r,c-2)]==t) bad=true;
        if(r>=2 && b[idx(r-1,c)]==t && b[idx(r-2,c)]==t) bad=true;
        if(!bad) break;
        if(++attempts>50) break;
      }
    }
  }
  return b;
}

// ボード描画
function renderBoard(){
  boardEl.innerHTML='';
  for(let i=0;i<board.length;i++){
    const t=board[i];
    const cell=document.createElement('div');
    cell.className='cell';
    cell.dataset.i=i;
    if(t>0){
      const img=document.createElement('img');
      img.src=`tile${t}.png`;
      cell.appendChild(img);
    }
    boardEl.appendChild(cell);
  }
}

// ゲーム開始
function startGame(){
  overlay.style.display='none';
  gameOverOverlay.style.display='none';
  board=generateBoard(); score=0; timeLeft=GAME_TIME; combo=1; processing=false; running=true;
  renderBoard(); updateUI();
  sndStart.currentTime=0; sndStart.play();
  bgm.currentTime=0; bgm.play().catch(()=>{});
  timerId=setInterval(()=>{
    timeLeft--;
    if(timeLeft<=0){ clearInterval(timerId); running=false; bgm.pause(); showGameOver(); }
    updateUI();
  },1000);
}

function updateUI(){
  scoreEl.textContent=score;
  timeEl.textContent=timeLeft;
  comboEl.textContent=combo>1?`${combo}コンボ！`:'';
}

// ゲームオーバー表示
function showGameOver(){
  gameOverOverlay.style.display='flex';
  gameOverOverlay.innerHTML=`<div>最終スコア</div><div style="font-size:15vw;font-weight:900;">${score}</div>`;
  
  // APIでランクイン判定
  fetch(API_BASE_URL+'check_rank.php',{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:new URLSearchParams({score})
  })
  .then(res=>res.json())
  .then(data=>{
    if(data.success && data.entersTop20){
      // 名前入力フォーム
      const input = document.createElement('input');
      input.type='text'; input.id='playerName'; input.placeholder='名前を入力';
      input.style.fontSize='5vw'; input.style.margin='1rem 0';
      gameOverOverlay.appendChild(input);

      const saveBtn = document.createElement('button');
      saveBtn.textContent='登録';
      saveBtn.className='start-btn';
      gameOverOverlay.appendChild(saveBtn);

      saveBtn.addEventListener('click',()=>{
        const name = document.getElementById('playerName').value || '名無し';
        // APIで登録
        fetch(API_BASE_URL+'save_rank.php',{
          method:'POST',
          headers:{'Content-Type':'application/x-www-form-urlencoded'},
          body:new URLSearchParams({score,name})
        })
        .then(r=>r.json())
        .then(resp=>{
          // 登録完了 → 再挑戦ボタン
          gameOverOverlay.innerHTML=`
            <div>登録完了！</div>
            <div style="font-size:15vw;font-weight:900;">${score}</div>
            <button id="restartBtn" class="start-btn">再挑戦</button>
          `;
          document.getElementById('restartBtn').addEventListener('click',()=>{ startGame(); });
        });
      });
    } else {
      // ランクインなしは即再挑戦
      gameOverOverlay.innerHTML+=`<button id="restartBtn" class="start-btn">再挑戦</button>`;
      document.getElementById('restartBtn').addEventListener('click',()=>{ startGame(); });
    }
  });
}


// イベント
document.getElementById('startBtn').addEventListener('click',startGame);
document.getElementById('muteBtn').addEventListener('click',()=>{ bgm.muted=!bgm.muted; });
document.getElementById('pauseBtn').addEventListener('click',()=>{ 
  if(!running) return;
  if(timerId){ clearInterval(timerId); timerId=null; bgm.pause(); } 
  else{ timerId=setInterval(()=>{ timeLeft--; if(timeLeft<=0){ clearInterval(timerId); running=false; bgm.pause(); showGameOver(); } updateUI(); },1000); bgm.play().catch(()=>{});}
});
document.getElementById('rankingBtn').addEventListener('click',()=>{ 
  const overlay=document.getElementById('rankingOverlay'); overlay.style.display='flex';
  fetch(API_BASE_URL+'get_rank.php').then(r=>r.json()).then(data=>{
    const list=document.getElementById('rankingList');
    list.innerHTML='';
    data.ranks.forEach((e,i)=>{ list.innerHTML+=`<div>${i+1}. ${e.name} ${e.score}</div>`; });
  });
});
document.getElementById('closeRanking').addEventListener('click',()=>{ document.getElementById('rankingOverlay').style.display='none'; });
</script>
</body>
</html>
